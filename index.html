(function() {
  function setFavicon(url) {
    let link = document.querySelector("link[rel='icon']");
    if (!link) {
      link = document.createElement('link');
      link.rel = 'icon';
      document.head.appendChild(link);
    }
    link.href = url;
  }

  // Try logo.html first (draw it to canvas)
  fetch('logo.html')
    .then(r => r.text())
    .then(html => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const svg = doc.querySelector('svg');
      if (svg) {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        const svgData = new XMLSerializer().serializeToString(svg);
        const blob = new Blob([svgData], {type: 'image/svg+xml'});
        const url = URL.createObjectURL(blob);
        img.onload = () => {
          ctx.drawImage(img, 0, 0, 64, 64);
          setFavicon(canvas.toDataURL('image/png'));
          URL.revokeObjectURL(url);
        };
        img.src = url;
      }
    })
    .catch(() => {
      fetch('logo.jpg', {method: 'HEAD'})
        .then(r => { if (r.ok) setFavicon('logo.jpg'); })
        .catch(() => {});
    });
})();

    function getFileIcon(name) {
      if (name.endsWith('.html')) return '<i class="fab fa-html5 fi-html"></i>';
      if (name.endsWith('.css')) return '<i class="fab fa-css3-alt fi-css"></i>';
      if (name.endsWith('.js')) return '<i class="fab fa-js fi-js"></i>';
      return '<i class="fa fa-file"></i>';
    }

    function getFileMode(name) {
      if (name.endsWith('.html')) return 'htmlmixed';
      if (name.endsWith('.css')) return 'css';
      if (name.endsWith('.js')) return 'javascript';
      return 'htmlmixed';
    }

    function getCMTheme() {
      return editorTheme === 'dark' ? 'dracula' : 'default';
    }

    function syncActiveContent() {
      if (activeTab && editorInstances[activeTab]) {
        const file = projectFiles.find(f => f.filename === activeTab);
        if (file) file.content = editorInstances[activeTab].getValue();
      }
    }

    function renderFileTree() {
      syncActiveContent();
      const tree = document.getElementById('file-tree');
      tree.innerHTML = '';
      projectFiles.forEach(f => {
        const item = document.createElement('div');
        item.className = 'file-item' + (activeTab === f.filename ? ' active' : '');
        item.innerHTML = `${getFileIcon(f.filename)}<span>${f.filename}</span><button class="file-del" onclick="deleteFileFromProject('${f.filename}')"><i class="fa fa-times"></i></button>`;
        item.onclick = (e) => {
          if (e.target.closest('.file-del')) return;
          openFileInEditor(f.filename);
        };
        tree.appendChild(item);
      });
    }

    function renderTabs() {
      const tabs = document.getElementById('editor-tabs');
      tabs.innerHTML = '';
      openTabs.forEach(name => {
        const tab = document.createElement('div');
        tab.className = 'editor-tab' + (activeTab === name ? ' active' : '');
        tab.innerHTML = `${getFileIcon(name)} ${name}`;
        tab.onclick = () => switchTab(name);
        tabs.appendChild(tab);
      });
    }

    function openFileInEditor(filename) {
      syncActiveContent();
      if (!openTabs.includes(filename)) openTabs.push(filename);
      activeTab = filename;
      renderTabs();
      renderFileTree();
      renderEditorContent();
    }

    function switchTab(filename) {
      syncActiveContent();
      activeTab = filename;
      renderTabs();
      renderFileTree();
      renderEditorContent();
    }

    function buildAndRender(iframe) {
      const htmlFile = projectFiles.find(f => f.filename === 'index.html');
      const cssFiles = projectFiles.filter(f => f.filename.endsWith('.css'));
      const jsFiles = projectFiles.filter(f => f.filename.endsWith('.js'));

      let htmlContent = htmlFile ? htmlFile.content : '<html><body></body></html>';

      const combinedCss = cssFiles.map(f => f.content).join('\n');
      const combinedJs = jsFiles.map(f => f.content).join('\n');

      const parser = new DOMParser();
      const parsedDoc = parser.parseFromString(htmlContent, 'text/html');

      const styleTag = parsedDoc.createElement('style');
      styleTag.textContent = combinedCss;
      parsedDoc.head.appendChild(styleTag);

      const scriptTag = parsedDoc.createElement('script');
      scriptTag.textContent = combinedJs;
      parsedDoc.body.appendChild(scriptTag);

      iframe.srcdoc = '<!DOCTYPE html>\n' + parsedDoc.documentElement.outerHTML;
    }

    function updateSplitPreview() {
      const frame = document.getElementById('split-preview-frame');
      if (frame) buildAndRender(frame);
    }

    function makeCMInstance(container, filename) {
      const file = projectFiles.find(f => f.filename === filename);
      if (!file) return null;
      container.innerHTML = '';
      const wrapper = document.createElement('div');
      wrapper.style.height = '100%';
      container.appendChild(wrapper);
      const cm = CodeMirror(wrapper, {
        value: file.content || '',
        mode: getFileMode(filename),
        theme: getCMTheme(),
        lineNumbers: true,
        indentWithTabs: false,
        tabSize: 2,
        lineWrapping: true,
        inputStyle: 'contenteditable',
        spellcheck: true,
        autocorrect: true,
        autocapitalize: false,
        undoDepth: 200
      });
      cm.setSize('100%', '100%');
      cm.on('change', () => {
        file.content = cm.getValue();
        if (editorMode === 'split') updateSplitPreview();
      });
      setTimeout(() => cm.refresh(), 100);
      editorInstances[filename] = cm;
      return cm;
    }

    function renderEditorContent() {
      const content = document.getElementById('editor-content');

      if (editorMode === 'split') {
        content.innerHTML = '<div class="editor-split"><div class="split-left" id="split-code-area"></div><div class="split-right"><iframe id="split-preview-frame" sandbox="allow-scripts allow-same-origin"></iframe></div></div>';
        const area = document.getElementById('split-code-area');
        if (activeTab) makeCMInstance(area, activeTab);
        updateSplitPreview();
        return;
      }

      if (editorMode === 'preview') {
        content.innerHTML = '<iframe id="preview-only-frame" style="width:100%;height:100%;border:none;" sandbox="allow-scripts allow-same-origin"></iframe>';
        buildAndRender(document.getElementById('preview-only-frame'));
        return;
      }

      content.innerHTML = '';
      if (!activeTab) return;
      makeCMInstance(content, activeTab);
    }

    function runPreview() {
      syncActiveContent();
      switchMode('preview');
    }

    window.runPreview = runPreview;

    window.editorUndo = function() {
      if (activeTab && editorInstances[activeTab]) {
        editorInstances[activeTab].undo();
        editorInstances[activeTab].focus();
      }
    };

    window.editorRedo = function() {
      if (activeTab && editorInstances[activeTab]) {
        editorInstances[activeTab].redo();
        editorInstances[activeTab].focus();
      }
    };

    window.toggleEditorTheme = function() {
      editorTheme = editorTheme === 'dark' ? 'light' : 'dark';
      const pill = document.getElementById('theme-pill');
      const label = pill.querySelector('.theme-pill-label');
      pill.setAttribute('data-theme', editorTheme);
      label.textContent = editorTheme;

      const editorView = document.getElementById('editor-view');
      if (editorTheme === 'light') {
        editorView.classList.add('editor-view-light');
      } else {
        editorView.classList.remove('editor-view-light');
      }

      Object.values(editorInstances).forEach(cm => {
        cm.setOption('theme', getCMTheme());
      });

      const splitFrame = document.getElementById('split-preview-frame');
      if (splitFrame) updateSplitPreview();
    };

    window.switchMode = function(mode) {
      syncActiveContent();
      editorMode = mode;
      document.getElementById('mode-code').classList.toggle('active', mode === 'code');
      document.getElementById('mode-split').classList.toggle('active', mode === 'split');
      document.getElementById('mode-preview').classList.toggle('active', mode === 'preview');
      editorInstances = {};
      renderEditorContent();
    };

    window.promptAddFile = function() {
      openModal('New File', 'e.g. style.css', 'Add', (name) => {
        if (!name.endsWith('.html') && !name.endsWith('.css') && !name.endsWith('.js')) {
          showToast('Only .html, .css, .js files allowed');
          return;
        }
        if (projectFiles.find(f => f.filename === name)) {
          showToast('File already exists');
          return;
        }
        projectFiles.push({ filename: name, content: '' });
        closeModal();
        renderFileTree();
        openFileInEditor(name);
        showToast('File added');
      });
    };

    window.deleteFileFromProject = function(name) {
      if (projectFiles.length <= 1) { showToast("Can't delete the only file"); return; }
      projectFiles = projectFiles.filter(f => f.filename !== name);
      openTabs = openTabs.filter(t => t !== name);
      if (activeTab === name) activeTab = openTabs[0] || null;
      delete editorInstances[name];
      renderFileTree();
      renderTabs();
      renderEditorContent();
      showToast('File removed');
    };

async function saveProject() {
  if (!currentUser || !currentProject) return;
  syncActiveContent();
  const btn = document.getElementById('save-btn');
  btn.innerHTML = '<span class="loader"></span>';
  btn.disabled = true;
  try {
    await setDoc(doc(db, 'projects', currentProject.id), {
      name: currentProject.name,
      uid: currentUser.uid,
      status: currentProject.status || 'private',
      files: projectFiles,
      updatedAt: Date.now()
    });
    showToast('Saved!');
  } catch (e) {
    showToast('Save failed: ' + e.message);
  }
  btn.innerHTML = '<i class="fa fa-save"></i> Save';
  btn.disabled = false;
}

window.openEditor = async function(projectId) {
  const snap = await getDoc(doc(db, 'projects', projectId));
  if (!snap.exists()) { showToast('Project not found'); return; }
  const data = snap.data();
  
  currentProject = { 
    id: projectId, 
    name: data.name, 
    status: data.status || 'private' 
  };
  
  projectFiles = data.files || [{ filename: 'index.html', content: '<h1>Hello World</h1>' }];
  openTabs = projectFiles.length > 0 ? [projectFiles[0].filename] : [];
  activeTab = openTabs[0] || null;
  editorInstances = {};
  editorMode = 'code';

  const editorView = document.getElementById('editor-view');
  editorView.classList.remove('editor-view-light');
  editorTheme = 'dark';
  const pill = document.getElementById('theme-pill');
  pill.setAttribute('data-theme', 'dark');
  pill.querySelector('.theme-pill-label').textContent = 'dark';

  document.getElementById('editor-project-name').textContent = data.name;
  document.getElementById('mode-code').classList.add('active');
  document.getElementById('mode-split').classList.remove('active');
  document.getElementById('mode-preview').classList.remove('active');

  document.getElementById('dashboard-view').style.display = 'none';
  document.getElementById('editor-view').style.display = 'flex';

  // --- Create status select in nav bar ---
  const existingSelect = document.getElementById('global-status-select');
  if (existingSelect) existingSelect.remove();

  const selectWrapper = document.createElement('div');
  selectWrapper.id = 'global-status-select';
  selectWrapper.style.display = 'inline-flex';
  selectWrapper.style.alignItems = 'center';
  selectWrapper.style.marginLeft = '15px';
  selectWrapper.style.gap = '6px';

  const icon = document.createElement('i');
  icon.id = 'status-icon';
  icon.className = 'fa ' + (currentProject.status === 'public' ? 'fa-globe' : 'fa-lock');
  icon.style.color = '#1a1a1a';

  const select = document.createElement('select');
  select.id = 'project-status-select';
  select.style.background = 'rgba(255,255,255,0.15)';
  select.style.border = '1px solid rgba(0,0,0,0.15)';
  select.style.borderRadius = '20px';
  select.style.padding = '4px 8px';
  select.style.height = '30px';
  select.style.fontSize = '0.8rem';
  select.style.fontWeight = '700';
  select.style.color = '#1a1a1a';
  select.style.backdropFilter = 'blur(5px)';
  select.style.cursor = 'pointer';
  select.style.outline = 'none';

  select.innerHTML = `
    <option value="private" ${currentProject.status === 'private' ? 'selected' : ''}>Private</option>
    <option value="public" ${currentProject.status === 'public' ? 'selected' : ''}>Public</option>
  `;

  select.onchange = function() {
    const newStatus = this.value;
    document.getElementById('status-icon').className = 'fa ' + (newStatus === 'public' ? 'fa-globe' : 'fa-lock');
    updateProjectStatus(newStatus);
  };

  selectWrapper.appendChild(icon);
  selectWrapper.appendChild(select);

  const logo = document.getElementById('logo');
  logo.parentNode.insertBefore(selectWrapper, logo.nextSibling);
  // ---------------------------------------

  renderFileTree();
  renderTabs();
  renderEditorContent();
};

    window.previewProject = async function(projectId) {
      const snap = await getDoc(doc(db, 'projects', projectId));
      if (!snap.exists()) return;
      const data = snap.data();
      const files = data.files || [];
      const html = files.find(f => f.filename === 'index.html');
      const css = files.find(f => f.filename.endsWith('.css'));
      const js = files.find(f => f.filename.endsWith('.js'));

      let base = html ? html.content : '<html><body></body></html>';
      if (css) base = base.replace('</head>', `<style>${css.content}</style></head>`);
      if (js) base = base.replace('</body>', `<script>${js.content}<\/script></body>`);

      document.getElementById('fullscreen-iframe').srcdoc = base;
      document.getElementById('fullscreen-view').style.display = 'block';
      document.getElementById('nav').style.display = 'none';
    };

    window.confirmDeleteProject = function(id, name) {
      openModal(`Delete "${name}"?`, '', 'Yes, Delete', async (val) => {
        if (val.toLowerCase() === 'yes' || val.toLowerCase() === 'delete' || val) {
          await deleteDoc(doc(db, 'projects', id));
          closeModal();
          showToast('Deleted');
          loadDashboard();
        }
      });
      document.getElementById('modal-input').placeholder = 'Type anything to confirm';
    };

window.promptNewProject = function() {
  // Create a custom modal with two options
  const overlay = document.getElementById('modal-overlay');
  const modalBox = document.getElementById('modal-box');
  
  // Change modal content for project type selection
  document.getElementById('modal-title').textContent = 'New Project';
  document.getElementById('modal-input').style.display = 'none';
  
  const confirmBtn = document.getElementById('modal-confirm-btn');
  confirmBtn.style.display = 'none';
  
  // Create option buttons if not already present
  let optionsDiv = document.getElementById('new-project-options');
  if (!optionsDiv) {
    optionsDiv = document.createElement('div');
    optionsDiv.id = 'new-project-options';
    optionsDiv.style.display = 'flex';
    optionsDiv.style.gap = '10px';
    optionsDiv.style.marginTop = '15px';
    modalBox.querySelector('.modal-btns').before(optionsDiv);
  }
  
  optionsDiv.innerHTML = `
    <button class="modal-option-btn" id="empty-project-btn" style="flex:1; background:#f0f0f0; border:none; border-radius:10px; padding:12px; font-weight:700; cursor:pointer;">
      <i class="fa fa-file"></i> Empty
    </button>
    <button class="modal-option-btn" id="template-project-btn" style="flex:1; background:#e8f8ef; border:none; border-radius:10px; padding:12px; font-weight:700; cursor:pointer;">
      <i class="fa fa-copy"></i> From Template
    </button>
  `;
  
  const cancelBtn = document.querySelector('.modal-cancel');
  cancelBtn.onclick = function() {
    closeModal();
    document.getElementById('modal-input').style.display = 'block';
    confirmBtn.style.display = 'block';
    if (optionsDiv) optionsDiv.innerHTML = '';
  };
  
  document.getElementById('empty-project-btn').onclick = () => {
    closeModal();
    document.getElementById('modal-input').style.display = 'block';
    confirmBtn.style.display = 'block';
    optionsDiv.innerHTML = '';
    openModal('New Project', 'e.g. my-portfolio', 'Create', async (name) => {
      await createEmptyProject(name);
    });
  };
  
  document.getElementById('template-project-btn').onclick = () => {
    closeModal();
    document.getElementById('modal-input').style.display = 'block';
    confirmBtn.style.display = 'block';
    optionsDiv.innerHTML = '';
    openModal('Project Name', 'e.g. my-fork', 'Create', async (name) => {
      // For template, we need a source project ID – we'll prompt separately
      showToast('Coming soon: pick a template from public projects');
      // In a real implementation you'd show a project picker or use the forkProject flow
    });
  };
  
  overlay.style.display = 'block';
  modalBox.style.display = 'block';
};

window.backToDashboard = function() {
  syncActiveContent();
  const selectEl = document.getElementById('global-status-select');
  if (selectEl) selectEl.remove();
  document.getElementById('editor-view').style.display = 'none';
  document.getElementById('dashboard-view').style.display = 'block';
  currentProject = null;
  editorInstances = {};
  loadDashboard();
};

    window.openthe = function(m) {
      document.getElementById('overlay').style.display = 'block';
      if (m === 'sign') {
        document.getElementById('signer').style.display = 'block';
        document.getElementById('loger').style.display = 'none';
      } else {
        document.getElementById('loger').style.display = 'block';
        document.getElementById('signer').style.display = 'none';
      }
    };

    window.closeAll = function() {
      document.getElementById('signer').style.display = 'none';
      document.getElementById('loger').style.display = 'none';
      document.getElementById('overlay').style.display = 'none';
    };

    window.togglePass = function(id, icon) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    };

    window.handleSignUp = async function() {
      const email = document.getElementById('sign-email').value;
      const pass = document.getElementById('sign-pass').value;
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        closeAll();
        showToast('Account created!');
      } catch (e) {
        showToast(e.message);
      }
    };

    window.handleLogin = async function() {
      const email = document.getElementById('log-email').value;
      const pass = document.getElementById('log-pass').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        closeAll();
        showToast('Welcome back!');
      } catch (e) {
        showToast(e.message);
      }
    };

    window.logMeOut = async function() {
      await signOut(auth);
      location.reload();
    };

    async function checkSiteParam(user) {
      if (!siteParam) return false;
      const q = query(collection(db, 'projects'), where('name', '==', siteParam));

      document.getElementById('landing-page').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'none';

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  const navButtons = document.getElementById('buttons');
  const landing = document.getElementById('landing-page');
  const dash = document.getElementById('dashboard-view');

  if (siteParam) {
    const handled = await checkSiteParam(user);
    if (handled) return;
  }

  if (user) {
    landing.style.display = 'none';
    dash.style.display = 'block';
    navButtons.innerHTML = `<button onclick="logMeOut()" style="width:70px!important">Log Out</button>`;

    dash.style.display = 'none';
    navButtons.innerHTML = `
      <button id="sign" onclick="openthe('sign')">sign in</button>
      <button id="log" onclick="openthe('log')">log in</button>
    `;
  }
});
window.updateProjectStatus = function(newStatus) {
  if (!currentProject) {
    showToast('No project open');
    return;
  }
  currentProject.status = newStatus;
  showToast(`Project is now ${newStatus}`);
  saveProject(); // Auto-save the change
};

window.filterProjects = function() {
  const term = document.getElementById('albumSearch').value.toLowerCase();
  const cards = document.querySelectorAll('.project-card');
  
  cards.forEach(card => {
    const titleElement = card.querySelector('h3');
    const originalText = titleElement.textContent;
    const lowerText = originalText.toLowerCase();

    if (term && lowerText.includes(term)) {
      card.style.display = "block";
      
      const start = lowerText.indexOf(term);
      const end = start + term.length;
      const highlighted = originalText.substring(0, start) + 
          `<mark style="background: yellow; color: black; padding: 0 2px; border-radius: 2px;">` + 
          originalText.substring(start, end) + `</mark>` + 
          originalText.substring(end);
      titleElement.innerHTML = highlighted;
    } else {
      titleElement.innerHTML = originalText; 
      card.style.display = term ? "none" : "block"; 
    }
  });
};

window.searchGlobalProjects = async function() {
  const term = document.getElementById('globalSearch').value.trim().toLowerCase();
  const grid = document.getElementById('album-grid');

  if (term.length < 2) {
    loadDashboard();  // Show user's own projects again
    return;
  }

  grid.innerHTML = '<p style="color:var(--muted);padding:1rem">Searching globally...</p>';

  try {
    const projectsRef = collection(db, 'projects');
    const q = query(projectsRef, where('status', '==', 'public'), where('name', '>=', term), where('name', '<=', term + '\uf8ff'));
    const querySnapshot = await getDocs(q);
    grid.innerHTML = '';

    if (querySnapshot.empty) {
      grid.innerHTML = '<div class="empty-state"><i class="fa fa-search"></i><p>No public projects found.</p></div>';
      return;
    }

    querySnapshot.forEach((doc) => {
      const data = doc.data();
      const card = document.createElement('div');
      card.className = 'project-card global-result';
      card.innerHTML = `
  <div class="project-card-icon"><i class="fa fa-globe"></i></div>
  <h3>${data.name}</h3>
  <p>By: ${data.author || 'Anonymous'}</p>
  <div class="card-actions">
    <button class="card-btn card-btn-view" onclick="previewProject('${doc.id}')">View</button>
    <button class="card-btn card-btn-fork" onclick="forkProject('${doc.id}')">Fork</button>
  </div>
`;
      grid.appendChild(card);
    });
  } catch (e) {
    console.error(e);
    grid.innerHTML = '<p style="color:red;padding:1rem">Search failed</p>';
  }
};
window.forkProject = async function(sourceProjectId) {
  if (!currentUser) {
    showToast('Please log in first');
    return;
  }
  
  const snap = await getDoc(doc(db, 'projects', sourceProjectId));
  if (!snap.exists()) {
    showToast('Source project not found');
    return;
  }
  
  const sourceData = snap.data();
  const sourceName = sourceData.name;
  
  // Prompt for new project name
  openModal(`Fork "${sourceName}"`, 'my-fork', 'Fork', async (newName) => {
    const cleanName = newName.toLowerCase().replace(/[^a-z0-9-_]/g, '-');
    
    // Check if name already exists for this user
    const q = query(collection(db, 'projects'), where('name', '==', cleanName), where('uid', '==', currentUser.uid));
    const existing = await getDocs(q);
    if (!existing.empty) {
      showToast('You already have a project with that name');
      return;
    }
    
    const newId = cleanName + '-' + Date.now();
    
    // Copy files from source
    const sourceFiles = sourceData.files || [{ filename: 'index.html', content: '<h1>Empty</h1>' }];
    
    await setDoc(doc(db, 'projects', newId), {
      name: cleanName,
      uid: currentUser.uid,
      status: 'private',
      files: sourceFiles,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      forkedFrom: sourceProjectId  // optional reference
    });
    
    closeModal();
    showToast('Project forked!');
    await loadDashboard();
    window.openEditor(newId);
  });
};

async function createEmptyProject(name) {
  const cleanName = name.toLowerCase().replace(/[^a-z0-9-_]/g, '-');
  const q = query(collection(db, 'projects'), where('name', '==', cleanName), where('uid', '==', currentUser.uid));
  const snap = await getDocs(q);
  if (!snap.empty) { showToast('Name already taken'); return; }
  
  const newId = cleanName + '-' + Date.now();
  await setDoc(doc(db, 'projects', newId), {
    name: cleanName,
    uid: currentUser.uid,
    status: 'private',
    files: [
      { filename: 'index.html', content: '<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="UTF-8">\n  <title>' + cleanName + '</title>\n</head>\n<body>\n  <h1>Hello World</h1>\n</body>\n</html>' }
    ],
    createdAt: Date.now(),
    updatedAt: Date.now()
  });
  closeModal();
  showToast('Empty project created!');
  await loadDashboard();
  window.openEditor(newId);
}
